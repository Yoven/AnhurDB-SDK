name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Test Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/golang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Junior Tip [why a FILE and not a pinned "1.24", 2026-09-14]: this
          # said go-version "1.24" and had not been true for a long time.
          # v2/golang/go.mod carries `toolchain go1.26.0`, and with the default
          # GOTOOLCHAIN=auto every go command here silently downloaded go1.26.0
          # and re-executed itself under it — CI was never testing on 1.24, it
          # was testing on a toolchain fetched mid-command. That fetched
          # toolchain then failed `go test -coverprofile` with
          # `go: no such tool "covdata"` for the three packages that have NO
          # test files (the root module, integrations/dspy,
          # scripts/parity_probe): since Go 1.26 `covdata` is no longer shipped
          # pre-built in pkg/tool and is built on demand, and that on-demand
          # build does not survive the auto-switch. Every test still PASSED and
          # the job still exited 1 — the SDK CI stayed red from 2026-09-06.
          # Reading the version from go.mod (setup-go prefers the `toolchain`
          # directive over the `go` directive) installs 1.26.0 up front, so no
          # switch happens and there is ONE place that decides the version.
          # CORRECAO 2026-09-14: go-version-file NAO resolveu. setup-go le a
          # diretiva `go` (1.24) e IGNORA `toolchain` — o log do run 34814283122
          # diz "Setup go version spec 1.24". Resultado: instala 1.24, e o
          # GOTOOLCHAIN=auto busca a 1.26 na hora do comando; e a toolchain
          # BAIXADA que nao traz `covdata` pre-construido, nao a instalada.
          # Pinar a versao aqui faz o action instalar a distribuicao completa,
          # entao nao ha troca e nao falta ferramenta. Mantem UM lugar que
          # decide a versao — mas esse lugar tem de ser o mesmo numero do
          # `toolchain` em v2/golang/go.mod; se um mudar, mude os dois.
          go-version: "1.26.0"
      - run: go mod tidy
      - run: go build -v ./...
      - run: go test -v ./... -coverprofile=coverage.out

  lint-python:
    name: Lint Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install -v
      - run: poetry run mypy anhurdb/

  test-python:
    name: Test Python SDK
    needs: lint-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install -v
      - run: poetry run pytest -vv tests/

  # Junior Tip [por que os plugins entraram na CI, 2026-10-17]: o provider do
  # Hermes (Python) e o harness de paridade Go x Python nunca rodavam em CI.
  # Quando o SDK 3.0 tipou o perfil, o plugin Go quebrou em compilacao e foi
  # consertado (26fe88c), mas o provider Python passou a montar o bloco de
  # memoria VAZIO em silencio por um mes: o teste que pegava isso existia e
  # ninguem o executava. Este job roda os testes do provider contra o SDK
  # Python DESTE commit, que e o mesmo que o INSTALL manda instalar.
  test-plugins:
    name: Test Hermes provider + Go/Python plugin parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Mesma versao que release-plugin.yml usa para os binarios.
          go-version: "1.24.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Python SDK the provider dogfoods
        working-directory: v2/python
        run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install -v
      - name: Hermes provider tests
        working-directory: v2/plugins/hermes-agent/tests
        # Junior Tip: NAO usar `poetry -C ../../../python run pytest .` aqui.
        # O -C muda o diretorio de trabalho, o `.` passa a ser v2/python e o
        # job roda os testes do SDK, verde, sem tocar no plugin. Chamar o
        # python do venv pelo caminho absoluto mantem o cwd neste diretorio.
        run: |
          set -euo pipefail
          sdk_python="$(cd ../../../python && poetry env info -p)/bin/python"
          "$sdk_python" -m pytest -q -rs -p no:cacheprovider .
      - name: Go/Python plugin parity
        working-directory: v2/plugins/tests/parity
        run: ./run_parity.sh

  build-ts:
    name: Build TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  test-ts:
    name: Test TypeScript SDK
    needs: build-ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
