name: SDK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    name: Test Go SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/golang
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Junior Tip [why a FILE and not a pinned "1.24", 2026-09-14]: this
          # said go-version "1.24" and had not been true for a long time.
          # v2/golang/go.mod carries `toolchain go1.26.0`, and with the default
          # GOTOOLCHAIN=auto every go command here silently downloaded go1.26.0
          # and re-executed itself under it — CI was never testing on 1.24, it
          # was testing on a toolchain fetched mid-command. That fetched
          # toolchain then failed `go test -coverprofile` with
          # `go: no such tool "covdata"` for the three packages that have NO
          # test files (the root module, integrations/dspy,
          # scripts/parity_probe): since Go 1.26 `covdata` is no longer shipped
          # pre-built in pkg/tool and is built on demand, and that on-demand
          # build does not survive the auto-switch. Every test still PASSED and
          # the job still exited 1 — the SDK CI stayed red from 2026-09-06.
          # Reading the version from go.mod (setup-go prefers the `toolchain`
          # directive over the `go` directive) installs 1.26.0 up front, so no
          # switch happens and there is ONE place that decides the version.
          # CORRECAO 2026-09-14: go-version-file NAO resolveu. setup-go le a
          # diretiva `go` (1.24) e IGNORA `toolchain` — o log do run 34814283122
          # diz "Setup go version spec 1.24". Resultado: instala 1.24, e o
          # GOTOOLCHAIN=auto busca a 1.26 na hora do comando; e a toolchain
          # BAIXADA que nao traz `covdata` pre-construido, nao a instalada.
          # Pinar a versao aqui faz o action instalar a distribuicao completa,
          # entao nao ha troca e nao falta ferramenta. Mantem UM lugar que
          # decide a versao — mas esse lugar tem de ser o mesmo numero do
          # `toolchain` em v2/golang/go.mod; se um mudar, mude os dois.
          go-version: "1.26.0"
      - run: go mod tidy
      - run: go build -v ./...
      - run: go test -v ./... -coverprofile=coverage.out

  lint-python:
    name: Lint Python SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install -v
      - run: poetry run mypy anhurdb/

  test-python:
    name: Test Python SDK
    needs: lint-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install poetry
          poetry install -v
      - run: poetry run pytest -vv tests/

  build-ts:
    name: Build TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build

  test-ts:
    name: Test TypeScript SDK
    needs: build-ts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
