# Junior Tip [por que este arquivo existe, e por que ele fica DENTRO de tests/]:
# o diretório do plugin tem `__init__.py` (ele É um pacote, é assim que o Hermes
# o carrega). O pytest, ao ver um `__init__.py` num diretório ancestral dentro do
# rootdir, cria um nó `Package` e IMPORTA esse `__init__.py` como módulo de
# topo — o que estoura em `attempted relative import with no known parent
# package`, porque o pacote real do plugin só existe sob o nome sintético que o
# host monta em tempo de execução (`_hermes_user_memory.<nome>`).
#
# Ancorando o rootdir aqui, a árvore de coleta começa em tests/ e o plugin é
# carregado UNICAMENTE pelo caminho do host (conftest.py:_load_plugin_package) —
# que é exatamente o que queremos testar. Não troque isto por um
# `tests/__init__.py`: isso reintroduziria o mesmo import por outro caminho.
[pytest]
testpaths = .
